[package]
name = "s3cc-organizer"
version = "1.0.0"
edition = "2021"
default-run = "s3cc-organizer"

[[bin]]
name = "s3cc-organizer"
path = "src/main.rs"

[lib]
name = "s3cc_organizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
quick-xml = "0.31"
rust_xlsxwriter = "0.79"
csv = "1.3"
calamine = "0.26"
base64 = "0.22"
anyhow = "1"
byteorder = "1"
chrono = { version = "0.4", features = ["clock"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2.5"
thiserror = "2"
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["UI", "UI_ViewManagement", "Win32_Storage_FileSystem"] }
