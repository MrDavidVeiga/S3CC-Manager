name: Release v1.0.0 Beta 2

# v1.0.0 Beta 2 — Windows x64, Linux x64, macOS Intel and macOS Apple Silicon
on:
  push:
    branches:
      - main
      - fix/full-reconciliation-manual-model-20261009
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the validated Beta 2 prerelease after all matrix builds pass"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-release:
    name: ${{ matrix.artifact_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2022
            target: ""
            build_args: --no-bundle
            binary_name: s3cc-organizer.exe
            packaged_binary: "Veiga's S3CC Manager.exe"
            artifact_name: S3CC-Manager-Windows-x64
            release_slug: Windows_x64

          - platform: ubuntu-22.04
            target: ""
            build_args: --no-bundle
            binary_name: s3cc-organizer
            packaged_binary: "Veiga's S3CC Manager"
            artifact_name: S3CC-Manager-Linux-x64
            release_slug: Linux_x64

          - platform: macos-15-intel
            target: x86_64-apple-darwin
            build_args: --target x86_64-apple-darwin --no-bundle
            binary_name: s3cc-organizer
            packaged_binary: "Veiga's S3CC Manager"
            artifact_name: S3CC-Manager-macOS-Intel
            release_slug: macOS_Intel

          - platform: macos-15
            target: aarch64-apple-darwin
            build_args: --target aarch64-apple-darwin --no-bundle
            binary_name: s3cc-organizer
            packaged_binary: "Veiga's S3CC Manager"
            artifact_name: S3CC-Manager-macOS-Apple-Silicon
            release_slug: macOS_Apple_Silicon

    runs-on: ${{ matrix.platform }}

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            zip

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install Rust stable
        if: matrix.target == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust stable with target
        if: matrix.target != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Restore application icon source
        run: node -e "const fs=require('fs');fs.writeFileSync('src-tauri/icons/manager-icon.png',Buffer.from(fs.readFileSync('src-tauri/icons/manager-icon.b64','utf8').trim(),'base64'))"

      - name: Generate application icons
        run: npm run tauri icon src-tauri/icons/manager-icon.png

      - name: Build frontend
        run: npm run build

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build portable binary
        run: npm run tauri build -- ${{ matrix.build_args }}

      - name: Locate Windows binary
        if: matrix.platform == 'windows-2022'
        id: locate_windows
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path . -Filter "${{ matrix.binary_name }}" -Recurse -File |
            Where-Object {
              $_.FullName -match '\\release\\' -and
              $_.FullName -notmatch '\\bundle\\'
            } |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $file) {
            Write-Host "Executable candidates:"
            Get-ChildItem -Path . -Filter "*.exe" -Recurse -File | Select-Object FullName
            throw "Manager executable not found."
          }

          "artifact_path=$file" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Locate Unix binary
        if: matrix.platform != 'windows-2022'
        id: locate_unix
        shell: bash
        run: |
          set -euo pipefail
          file_path="$(find . -type f -name "${{ matrix.binary_name }}" ! -path "*/bundle/*" | grep "/release/" | head -n 1 || true)"
          if [ -z "$file_path" ]; then
            echo "Binary candidates:"
            find . -type f -path "*/release/*" | sort || true
            exit 1
          fi
          echo "artifact_path=$file_path" >> "$GITHUB_OUTPUT"

      - name: Package Windows portable release
        if: matrix.platform == 'windows-2022'
        shell: pwsh
        run: |
          $stage = Join-Path $PWD "release-stage/${{ matrix.artifact_name }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "${{ steps.locate_windows.outputs.artifact_path }}" (Join-Path $stage "${{ matrix.packaged_binary }}")
          Copy-Item "README.md" (Join-Path $stage "README.md")
          Copy-Item "docs/RELEASE-NOTES-v1.0.0-BETA2.md" (Join-Path $stage "RELEASE-NOTES.md")

          $zip = "VeigasS3CCManager_v1.0.0_Beta2_${{ matrix.release_slug }}.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          "$hash  $zip" | Out-File -Encoding ascii "VeigasS3CCManager_v1.0.0_Beta2_${{ matrix.release_slug }}_SHA256.txt"

      - name: Package Unix portable release
        if: matrix.platform != 'windows-2022'
        shell: bash
        run: |
          set -euo pipefail
          stage="release-stage/${{ matrix.artifact_name }}"
          mkdir -p "$stage"
          cp "${{ steps.locate_unix.outputs.artifact_path }}" "$stage/${{ matrix.packaged_binary }}"
          chmod +x "$stage/${{ matrix.packaged_binary }}"
          cp README.md "$stage/README.md"
          cp docs/RELEASE-NOTES-v1.0.0-BETA2.md "$stage/RELEASE-NOTES.md"

          zip_name="VeigasS3CCManager_v1.0.0_Beta2_${{ matrix.release_slug }}.zip"
          (cd "$stage" && zip -r "../../$zip_name" .)

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$zip_name" > "VeigasS3CCManager_v1.0.0_Beta2_${{ matrix.release_slug }}_SHA256.txt"
          else
            shasum -a 256 "$zip_name" > "VeigasS3CCManager_v1.0.0_Beta2_${{ matrix.release_slug }}_SHA256.txt"
          fi

      - name: Upload portable package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            VeigasS3CCManager_v1.0.0_Beta2_${{ matrix.release_slug }}.zip
            VeigasS3CCManager_v1.0.0_Beta2_${{ matrix.release_slug }}_SHA256.txt
          if-no-files-found: error
          retention-days: 30

  publish-prerelease:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish == true) ||
      (github.event_name == 'push' && github.event.head_commit.message == 'Release v1.0.0 Beta 2')
    needs: build-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all portable packages
        uses: actions/download-artifact@v7
        with:
          path: release-assets

      - name: Move existing tag only after all four builds pass
        uses: actions/github-script@v7
        env:
          EXPECTED_OLD_TAG: efabe232bdfcaabde19a045c8a429be0c9f2817c
        with:
          script: |
            const ref = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'tags/v1.0.0-beta.2'
            });
            const current = ref.data.object.sha;
            if (current !== process.env.EXPECTED_OLD_TAG) {
              core.setFailed(`Refusing publication: v1.0.0-beta.2 points to ${current}, expected ${process.env.EXPECTED_OLD_TAG}`);
              return;
            }
            await github.rest.git.updateRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'tags/v1.0.0-beta.2',
              sha: context.sha,
              force: true
            });

      - name: Replace prerelease assets and notes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: 'v1.0.0-beta.2'
            });
            if (!release.data.prerelease || release.data.draft) {
              core.setFailed('Refusing publication: existing Beta 2 release is not a published prerelease.');
              return;
            }
            const files = [];
            for (const entry of fs.readdirSync('release-assets', { withFileTypes: true })) {
              const dir = path.join('release-assets', entry.name);
              if (!entry.isDirectory()) continue;
              for (const file of fs.readdirSync(dir)) {
                if (file.endsWith('.zip') || file.endsWith('_SHA256.txt')) {
                  files.push(path.join(dir, file));
                }
              }
            }
            files.sort();
            if (files.length !== 8) {
              core.setFailed(`Refusing publication: expected 8 assets, found ${files.length}.`);
              return;
            }
            const names = new Set(files.map(file => path.basename(file)));
            const expected = [
              'VeigasS3CCManager_v1.0.0_Beta2_Windows_x64.zip',
              'VeigasS3CCManager_v1.0.0_Beta2_Windows_x64_SHA256.txt',
              'VeigasS3CCManager_v1.0.0_Beta2_Linux_x64.zip',
              'VeigasS3CCManager_v1.0.0_Beta2_Linux_x64_SHA256.txt',
              'VeigasS3CCManager_v1.0.0_Beta2_macOS_Intel.zip',
              'VeigasS3CCManager_v1.0.0_Beta2_macOS_Intel_SHA256.txt',
              'VeigasS3CCManager_v1.0.0_Beta2_macOS_Apple_Silicon.zip',
              'VeigasS3CCManager_v1.0.0_Beta2_macOS_Apple_Silicon_SHA256.txt'
            ];
            if (expected.some(name => !names.has(name))) {
              core.setFailed(`Refusing publication: artifact names are incomplete: ${[...names].join(', ')}`);
              return;
            }
            for (const asset of release.data.assets) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id
              });
            }
            for (const file of files) {
              const name = path.basename(file);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name,
                label: name,
                data: fs.readFileSync(file),
                headers: {
                  'content-type': name.endsWith('.zip') ? 'application/zip' : 'text/plain',
                  'content-length': fs.statSync(file).size
                }
              });
            }
            const body = fs.readFileSync('docs/RELEASE-NOTES-v1.0.0-BETA2.md', 'utf8');
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              tag_name: 'v1.0.0-beta.2',
              target_commitish: context.sha,
              name: "Veiga's S3CC Manager v1.0.0 Beta 2",
              body,
              prerelease: true,
              draft: false
            });
